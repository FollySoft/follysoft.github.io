<!DOCTYPE html>
<html>
<head>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, user-scalable=yes, initial-scale=1, maximum-scale=1">
    <!-- <META name="viewport" content="initial-scale=0.66, user-scalable=no">  -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta id="theme-color" name="theme-color" content="#ffffff">

    <base target="_blank">

    <title>AmericAmera</title>

    <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700" rel="stylesheet" type="text/css">
    <link rel="stylesheet" href="main.css">    

</head>

<body>

<div id="container">
    <div id="video-container">
      <!-- <div class="crop"><video id="gum-local" autoplay playsinline></video></div> -->
      <video width="480" height="480" id="gum-local" autoplay playsinline></video>
      <!-- <img id="overlay" class="draggable" src="./amfoo-whitelogo.png"/> -->
      <img id="overlay" src="./amfoo-whitelogo.png"/>
    </div>
    <!-- <canvas id="canvas" width="520" height="520"></canvas> -->
    <canvas id="canvas" width="480" height="480"></canvas>
    <!-- <div id="output">
      <img id="photo"/>
    </div> -->
    <div id="button-container">
      <button id="showVideo">Open Camera</button>
    </div>
    <div id="active-buttons">
      <button id="takePhoto" onclick="takepicture()">Capture</button>
      <button id="retakePhoto" onclick="clearphoto()">Retake</button>
      <button id="savePhoto" onclick="downloadImage()" disabled="true">Download</button>
    </div>    
</div>

<script src="main.js"></script>

</body>
</html>
